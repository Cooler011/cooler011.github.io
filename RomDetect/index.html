<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooler01s Website</title>
<meta name="description" content="Inspect retro game ROM information directly in your browser.">
<link rel="icon" type="image/png" href="../SNOW.png">
<link rel="apple-touch-icon" href="../SNOW.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cooler01">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3584e4">
<style>
@font-face {
  font-family: "LucidaGrande";
  src: url("../font1.ttf") format("truetype");
}

:root {
  --primary: hsl(213, 79%, 56%);
  --light: hsl(181, 95%, 92%);
}

* { box-sizing: border-box; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background-image: url("../BGsnow.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: "LucidaGrande", Helvetica, Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  animation: fadeIn .8s ease;
}

.page {
  width: min(1000px, calc(100% - 40px));
  margin: 0 auto;
  padding: 32px 0 60px;
}

.site-title {
  margin: 10px 0 8px;
  text-align: center;
  font-size: 42px;
  text-shadow: 0 1px 0 rgba(255,255,255,.4), 0 2px 8px rgba(0,0,0,.7);
}

.welcome-text {
  margin: 0 0 34px;
  text-align: center;
  font-size: 18px;
  text-shadow: 0 1px 0 rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.7);
}

/* ripped from the site's blog-card look */
.black-box {
  background: rgba(0, 0, 0, .48);
  border: 1px solid rgba(255,255,255,.38);
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
}

.rom-picker {
  width: 310px;
  height: 250px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
}

.rom-picker:hover,
.rom-picker.drag {
  transform: translateY(-3px);
  background: rgba(0,0,0,.58);
  box-shadow: 0 12px 30px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.24);
}

.rom-picker-inner strong {
  display: block;
  font-size: 25px;
  margin-bottom: 10px;
  text-shadow: 0 2px 5px rgba(0,0,0,.85);
}

.rom-picker-inner span {
  display: block;
  font-size: 14px;
  color: rgba(255,255,255,.78);
  line-height: 1.5;
  text-shadow: 0 2px 5px rgba(0,0,0,.85);
}

.select-row {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}

.aqua-button {
  display: inline-block;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  color: black;
  text-decoration: none;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-image:
    linear-gradient(hsl(0 0% 100% / .85), transparent 10px),
    linear-gradient(hsl(0 0% 100% / .25) 10px, transparent 10px),
    radial-gradient(circle at 10px 5px, hsl(0 0% 100% / .25) 5px, transparent 5px),
    radial-gradient(circle at 0 5px, hsl(0 0% 100% / .25) 5px, transparent 5px),
    linear-gradient(var(--primary), var(--light));
  padding: .6em 3em;
  background-size: 100%, calc(100% - 20px), 10px 10px, 10px 10px, 100%;
  background-position: top, top center, top left, top right, center;
  background-repeat: no-repeat;
  border: 0;
  border-radius: 100vw;
  position: relative;
  cursor: pointer;
}

.aqua-button:active { box-shadow: inset 0 0 30px rgba(0,0,0,.55); }
.aqua-button::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -1px;
  margin-inline: auto;
  background: linear-gradient(hsl(240,74%,30%), hsl(0,0%,38%));
  border-radius: 100vw;
}

input[type=file], #forced, #clear { display:none; }
#status {
  text-align:center;
  margin: 16px 0 0;
  color: rgba(255,255,255,.72);
  font-size: 13px;
  text-shadow: 0 2px 5px rgba(0,0,0,.9);
}

/* Long sideways rectangle shown after a ROM is picked. */
.filecard {
  width: 100%;
  margin-top: 34px;
  padding: 0;
  overflow: hidden;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 20px;
  box-shadow: 0 12px 45px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.2);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

.head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:20px 24px;
  border-bottom:1px solid rgba(255,255,255,.22);
}

.name {
  font-size: 23px;
  font-weight: bold;
  overflow-wrap:anywhere;
  text-shadow: 0 2px 6px rgba(0,0,0,.9);
}

.badge {
  flex-shrink:0;
  padding:6px 11px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:999px;
  background:rgba(255,255,255,.1);
  font-size:13px;
}

.content { padding: 22px 24px 25px; }
.grid {
  display:grid;
  grid-template-columns:190px minmax(0,1fr);
  gap:0 18px;
}
.k, .v {
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.11);
}
.k { color:rgba(255,255,255,.68); }
.v { overflow-wrap:anywhere; }
.good { color:#b9efa0; }
.bad { color:#ffadbb; }
.unknown { color:#ffe39a; }
.hashes { margin-top:16px; }
.footer {
  text-align:center;
  margin-top:25px;
  color:rgba(255,255,255,.65);
  font-size:12px;
}

@media (max-width:700px) {
  body { background-attachment:scroll; }
  .page { width:min(100% - 24px,1000px); padding-top:20px; }
  .site-title { font-size:36px; }
  .welcome-text { font-size:16px; }
  .rom-picker { width:min(300px,100%); height:230px; }
  .grid { grid-template-columns:1fr; }
  .k { border-bottom:0; padding-bottom:2px; margin-top:6px; }
  .v { padding-top:2px; }
  .head { align-items:flex-start; flex-direction:column; }
  .badge { align-self:flex-start; }
}
</style>
</head>
<body>
<main class="page">
  <h1 class="site-title">RomDetector</h1>
  <p class="welcome-text">Based on RetroSpector</p>

  <div class="select-row" style="margin-top:-18px; margin-bottom:28px;">
    <a href="https://cooler01.com/" style="text-decoration:none;">
      <button class="aqua-button" type="button">Back</button>
    </a>
  </div>

  <label class="rom-picker black-box" id="drop" for="picker">
    <div class="rom-picker-inner">
      <strong>Select a ROM</strong>
      <span>Drop a ROM into this box<br>or use the button below.</span>
    </div>
  </label>

  <div class="select-row">
    <button class="aqua-button" type="button" id="chooseButton">Choose ROM</button>
  </div>

  <input id="picker" type="file">
  <select id="forced"><option value="auto" selected>Auto-detect system</option></select>
  <button id="clear" type="button">Clear</button>

  <div id="status">Ready.</div>
  <div id="out"></div>

  <p class="footer">ROMs are inspected locally in your browser.</p>
</main>
<script>

</body>
</html>
